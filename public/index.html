<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17212C">
<title>Le chemin de l'Avent</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="app.js" type="module"></script>
</head>
<body>
<svg class="textures" aria-hidden="true" focusable="false"><defs id="textures"></defs></svg>
<main>
  <header class="tete">
    <p class="unite">Pionniers et Caravelles</p>
    <h1>Le chemin de l'Avent</h1>
    <p class="intro">Un caillou par jour jusqu'à Noël. Casse celui du jour pour découvrir sa couleur, et pose-le sur le cairn.</p>
  </header>

  <figure class="cairn" aria-hidden="true">
    <svg id="cairn" viewBox="0 96 320 150"></svg>
  </figure>
  <p id="statut" class="statut" role="status"></p>

  <ol id="cases" class="cases" aria-label="Les 24 jours"></ol>
</main>

<dialog id="fenetre" aria-labelledby="fenetre-titre">
  <div class="fenetre-corps">
    <header class="fenetre-tete">
      <span id="fenetre-pierre" class="fenetre-pierre"></span>
      <div>
        <p id="fenetre-date" class="fenetre-date"></p>
        <h2 id="fenetre-titre" tabindex="-1" autofocus></h2>
        <p id="fenetre-deja" class="deja" hidden></p>
      </div>
      <button class="fermer" type="button" aria-label="Fermer">×</button>
    </header>
    <div id="fenetre-contenu" class="contenu fenetre-contenu"></div>
  </div>
</dialog>
</body>
</html>
